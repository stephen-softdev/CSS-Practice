<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Function</title>
</head>
<body>
    
    
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        .container {
          width: calc(100% - 40px);
          margin: 20px;
        }
    
        .circle {
          width: 200px;
          height: 200px;
          background-color: rgb(207, 26, 165);
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 20px;
          color: white;
          font-weight: bold;
        }  .container1 {
          width: calc(100% - 40px);
          margin: 20px;
          display: flex;
          justify-content: space-between;
        }
    
        .box1 {
          width: calc(100% / 3 - 20px);
          height: 200px;
          background-color: rgb(15, 215, 75);
          display: flex;
          justify-content: center;
          align-items: center;
          font-size: 20px;
          color: white;
          font-weight: bold;
        }
      </style>
    </head>
    <body>
      <div class="container1">
        <div class="circle">
          <span>Circle</span>
        </div>
      </div>
      <div class="container1">
        <div class="box1">
          <span>Box 1</span>
        </div>
        <div class="box1">
          <span>Box 2</span>
        </div>
        <div class="box1">
          <span>Box 3</span>
        </div>
      </div>
    </body>
    </html>
</body>
</html>
