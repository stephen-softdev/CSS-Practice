<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briyani Special</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #ffcb70, #ff6f61);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .bri {
            height: 70vh;
            width: 70vw;
            background: url(./leaf.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .bri img {
            height: 350px;
            width: 350px;
            border-radius: 50%;
            animation: briyani 5s linear infinite;
            box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes briyani {
            0% {
                transform: rotate(0deg);
                filter: brightness(1);
            }
            50% {
                transform: rotate(180deg);
                filter: brightness(1.3);
            }
            100% {
                transform: rotate(360deg);
                filter: brightness(1);
            }
        }
    </style>
</head>
<body>
    <div class="bri">
        <img src="./Chicken-Biryani-Recipe.jpg" alt="briyani">
    </div>
</body>
</html>
