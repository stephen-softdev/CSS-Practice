<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .ho{
            height: 50vh;
            width: 500%;
            background-color: #9df0b3;
            display: flex;
            justify-content: left;
            align-items: center;
        }
        .container{
            height: 100vh;
            width: 100%;
            background-color: #9df0b3;
            display: flex;
            justify-content: left;
            align-items: center;
        }
        .right{
            height:30vh;
            width: 30vh;
            margin-left: 150px;
        background-color: #097b27; 
        transform: skew(45deg); 
    }
    .ho:hover{
        animation: ani 14 ease-in 0 infinite;
        .right{
            height: 50vh;
            width: 50vh;
        }
    }
    @keyframes ani{
        0%{
            transform: translateX(-100px);
            transform: rotate(20deg);
        }
        25%{
            transform: translateX(100px);
            transform: rotate(40deg);
        }
        50%{
            transform: translateX(200px);
            transform: rotate(50deg);
        }
        75%{
            transform: translateX(300px);
            transform: rotate(70deg);
        }
        100%{
            transform: translateX(400px);
            transform: rotate(90deg);
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="ho">
        <div class="right"></div>
          <div class="right"></div>
            <div class="right"></div>
              <div class="right"></div>
              </div>
    </div>
</body>
</html>
