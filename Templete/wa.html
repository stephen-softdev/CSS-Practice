<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whatsapp</title>
    <style>
        .grid {
             display: grid;
             grid-template-columns: 5% 30% 65%;
             grid-template-rows: 20% 80%;
             grid-template-areas:
                "side1 contact-detail contact-detail"
                 "side1 side2 content";
             gap: 2px;
}
        .side1{
            grid-area: side1;
            height: 100vh;
            background-color: rgb(76, 57, 32);
        }
        .side2{
            grid-area: side2;
            height: 100vh;
            background-color: #b65858;
        }
        .contact-detail{
            grid-area: contact-detail;
            width: 100vw;
            background-color: #641c1c;
        }
        .content{
            grid-area: content;
            height: 100vh;
            background-color: #785454;
        }
        
    </style>
</head>
<body>
    <div class="grid">
    <div class="side1"></div>
    <div class="side2"></div>
    <div class="contact-detail"></div>
    <div class="content"></div>
    </div>
</body>
</html>
