<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background-color: red;
        transform: rotate(45deg);
        margin: 80px;
      }
      .box1 {
        width: 200px;
        height: 200px;
        background-color: red;
        transform: translate(50px, 70px);
      }
      .box2{
        margin-top: 50px;
        width:200px;
        height:200px;
        background-color: brown;
        transform: scale(0.5);
      }
      .box3{
        margin-top: 50px;
        margin-left: 150px;
        width: 200px;
        height: 200px;
        background-color: red;
        transform: skew(30deg,40deg);
      }
      .box4{
        width: 200px;
        height:200px;
        background-color: red;
        transform: rotateX(45deg);
      }
    </style>
  </head>
  <body>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4">hi</div>
  </body>
</html>
