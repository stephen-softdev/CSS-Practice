<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gradient</title>
    <style>
      .linear-gradient {
        height: 100px;
        width: 100px;
        background: linear-gradient(to left, red, yellow);
      }
      .radial-gradient {
        margin-top: 10px;
        height: 100px;
        width: 100px;
        background: radial-gradient(circle, red, yellow, green);
      }
      .conic-gradient {
        margin-top: 10px;
        height: 100px;
        width: 100px;
        background: conic-gradient(from 50deg, red, yellow, green, red);
      }
    </style>
  </head>
  <body>
    <div class="linear-gradient"></div>
    <div class="radial-gradient"></div>
    <div class="conic-gradient"></div>
  </body>
</html>
