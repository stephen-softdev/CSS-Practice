<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>briyani</title>
    <style>
      .bri {
        margin-top: 100px;
        height: 70vh;
        width: 70vw;
        background: url(./leaf.jpg);
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .bri img {
        height: 400px;
        width: 400px;
        justify-self: center;
        animation: briyani 5s linear 0s infinite;
        border-radius: 50%;
      }
      @keyframes briyani {
        0% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(180deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="bri">
      <img src="./Chicken-Biryani-Recipe.jpg" alt=" briyani" />
    </div>
  </body>
</html>
