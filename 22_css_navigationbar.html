<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation bar</title>
    <style>
      .nav1 li {
        list-style-type: none;
        display: inline;
        padding-left: 40px;
        font-size: 2rem;
        text-align: center;
      }
      .nav1 {
        height: 40px;
        width: 70%;
        background-color: aqua;
      }
      .nav1 li:hover {
        background-color: beige;
      }
      .nav2 {
        background-color: bisque;
        color: black;
      }
      .nav2 li {
        list-style-type: none;
        display: inline;
        font-size: 2rem;
        padding-left: 40px;
      }
    </style>
  </head>
  <body>
    <h1>Navigation bar 1</h1>
    <div class="nav1">
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Service</li>
        <li>Contact</li>
      </ul>
    </div>
    <h1>Navigation bar 2</h1>
    <div class="nav2">
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Service</li>
        <li>Contact</li>
      </ul>
    </div>
  </body>
</html>
