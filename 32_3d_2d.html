<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .box{
            height: 300px;
            width: 300px;
            background-color: yellowgreen;
            transition-property: background-color;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
        }
        .box:hover{
            background-color: tomato;
        }
         .box2{
            margin-top: 50px;
            height: 300px;
            width: 300px;
            background-color: rgb(68, 50, 205);
            transition-property: background-color;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
        }
        .box2:hover{
            background-color: rgb(31, 183, 56);
            height: 500px;
            width: 500px;
        }
        .box3{
            margin-top: 50px;
            height: 300px;
            width: 300px;
            background-color: rgb(164, 204, 19);
            transition-property: all;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
        }
        .box3:hover{
            background-color: rgb(31, 173, 183);
           rotate: 150deg;
        }
        .box4{
            margin-top: 50px;
            height: 300px;
            width: 300px;
            background-color: rgb(71, 215, 220);
            transition-property: all;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
        }
        .box4:hover{
            background-color: rgb(192, 16, 24);
           transform: translateX(500px);
        }
         .box5{
            margin-top: 50px;
            height: 300px;
            width: 300px;
            background-color: rgb(8, 45, 47);
            transition-property: all;
            transition-duration: 2s;
            transition-timing-function: ease-in-out;
        }
        .box5:hover{
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="box"> </div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
</body>
</html>
